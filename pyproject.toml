[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuant-strategies"
version = "0.3.0"
description = "25+ quantitative trading strategies built on the kuant-core research framework: momentum, mean-reversion, cross-asset, crypto, options, ML, and alt-data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "zwmjj" },
]
keywords = [
    "quant", "strategies", "momentum", "mean-reversion",
    "crypto", "options", "systematic-trading", "alt-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "kuant-core>=0.3",
    "numpy>=1.24",
    "pandas>=2.0,<2.3",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
crypto = ["ccxt>=4.0"]
ml = ["lightgbm>=4.0", "xgboost>=2.0", "scikit-learn>=1.3"]
full = ["kuant-strategies[alpaca,crypto,ml]"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/zwmjj/kuant-strategies"

[tool.setuptools.packages.find]
include = ["strategies*"]
